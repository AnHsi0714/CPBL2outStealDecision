<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三聯盟盜壘決策報告</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text: #111418;
      --muted: #4b5563;
      --line: #c7ccd4;
      --accent: #9a4a06;
      --shadow: none;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --surface: #161b22;
        --text: #f2f4f7;
        --muted: #a8b0bd;
        --line: #343c48;
        --accent: #f0b26b;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.65;
    }
    .wrap { width: 100%; margin: 0 auto; padding: 0 8px; }
    header { flex: none; padding: 22px 0 0; }
    .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: .8rem; white-space: nowrap; }
    h1 { margin: 0; font-size: clamp(1.3rem, 2.6vw, 1.8rem); line-height: 1.2; letter-spacing: -.015em; }

    .tabs-wrap { margin: 16px 0 0 -8px; container-type: inline-size; }
    .tabs-row { display: flex; align-items: flex-end; flex-wrap: nowrap; gap: 14px; }

    .tabs { display: flex; flex: 0 1 auto; min-width: 0; flex-wrap: nowrap; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--text);
      font: inherit; font-size: .88rem; font-weight: 600; padding: 8px 16px; border-radius: 0;
      border-bottom: none; cursor: pointer; transition: background .15s ease, color .15s ease;
    }
    .tab:hover { background: color-mix(in srgb, var(--text) 12%, var(--surface)); border-color: var(--text); }
    .tab:active, .sub-tab:active, .league-tabs button:active { transform: translateY(1px); }
    .tab[aria-selected="true"], .tab[aria-selected="true"]:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
    .tabs .tab:first-child { border-left-width: 0; }

    .sub-tabs { display: flex; flex: none; flex-wrap: nowrap; align-items: center; gap: 6px; padding-left: 14px; padding-bottom: 4px; border-left: 1px solid var(--line); }
    .sub-tabs[hidden] { display: none; }
    .tab:focus-visible, .sub-tab:focus-visible { outline-offset: -3px; }
    .sub-tab {
      appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--text);
      font: inherit; font-size: .78rem; font-weight: 600; padding: 4px 12px; border-radius: 0; cursor: pointer;
    }
    .sub-tab:hover { background: color-mix(in srgb, var(--text) 14%, var(--bg)); border-color: var(--text); }
    .sub-tab[aria-selected="true"], .sub-tab[aria-selected="true"]:hover { background: var(--text); color: var(--surface); border-color: var(--text); }
    /* 空間不夠（展開目錄、手機）時依序處理：先縮內距與字級，讓小分頁仍和主分頁同一行；
       縮到最小仍放不下就改成主分頁 2 × 2 格、小分頁獨立一列，每個分頁都完整可見，不靠橫向捲動。須放在上面各分頁規則之後才蓋得過去 */
    @container (max-width: 832px) {
      .tab { padding: 8px 10px; font-size: .84rem; }
      .sub-tab { padding: 4px 8px; }
      .sub-tabs { gap: 4px; padding-left: 10px; }
    }
    @container (max-width: 724px) {
      .tab { padding: 8px 6px; font-size: .78rem; }
      .sub-tab { padding: 4px 6px; font-size: .74rem; }
    }
    @container (max-width: 659px) {
      .tabs-row { flex-wrap: wrap; margin-right: -8px; }
      .tabs { flex: 1 1 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; }
      .tab { padding: 8px; font-size: .88rem; border-bottom: 1px solid var(--line); }
      .tabs .tab:nth-child(odd) { border-left-width: 0; }
      .tabs .tab:nth-child(even) { border-right-width: 0; }
      .tabs .tab:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .sub-tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; gap: 6px; padding: 0; border-left: 0; }
      .sub-tabs::-webkit-scrollbar { display: none; }
      .sub-tabs .sub-tab:first-child { border-left-width: 0; }
      .sub-tab { padding: 4px 12px; font-size: .78rem; }
    }

    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
      padding: 0 8px;
    }

    .frame-panel {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 70vh;
      margin: -2px -8px 0;
      position: relative; z-index: 1;
      background: var(--surface); border-top: 2px solid var(--text);
    }
    .frame-toolbar {
      flex: none;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: .82rem; color: var(--muted);
    }
    .frame-label { min-width: 0; }
    .frame-toolbar a { flex: none; color: var(--accent); text-decoration: none; font-weight: 600; }
    .frame-toolbar a:hover { text-decoration: underline; }
    .report-frame { flex: 1 1 auto; display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

    body { text-wrap: pretty; }
    h1, h2, h3, .lede, .muted, .stat small, .stat span { text-wrap: balance; }
    th, .pill, .flag, .tab, .sub-tab, .legend-item { white-space: nowrap; }
    body { word-break: keep-all; overflow-wrap: anywhere; line-break: strict; }

    /* 動畫：只在使用者沒有要求減少動態時啟用；內容區塊與長條在第一次捲動到時才觸發（JS 加上 js-reveal、in） */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      header .wrap > * { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
      header .wrap > *:nth-child(2) { animation-delay: .08s; }
      header .wrap > *:nth-child(3) { animation-delay: .16s; }
      header .wrap > *:nth-child(4) { animation-delay: .24s; }
      .stat, .branch, .panel, .season-panel, .note-list li, .cell { transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
      .stat:hover, .branch:hover, .season-panel:hover { transform: translateY(-3px); border-color: var(--text); }
      .cell:hover { transform: scale(1.06); position: relative; z-index: 2; }
      tbody tr { transition: background-color .12s ease; }
      tbody tr:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
      .tab, .sub-tab, .league-tabs button { transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .15s ease; }
      .report-frame { transition: opacity .25s ease; }
      .js-reveal main section.reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
      .js-reveal main section.reveal.in { opacity: 1; transform: none; }
      .js-reveal .barr { transform: scaleX(0); transform-origin: left center; transition: transform 1s cubic-bezier(.2,.7,.2,1) .1s; }
      .js-reveal .barr.in { transform: scaleX(1); }
    }

    .league-tabs { display: flex; gap: 6px; margin-left: auto; }
    .league-tabs button { font: inherit; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 5px 14px; border: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--text); cursor: pointer; }
    .league-tabs button:hover { background: color-mix(in srgb, var(--text) 14%, transparent); border-color: var(--text); }
    .league-tabs button[aria-selected="true"], .league-tabs button[aria-selected="true"]:hover { background: var(--text); color: var(--surface); border-color: var(--text); }
    .league-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .title-row { align-items: center; }
    .mbar { display: none; }
    .mbar-row { display: flex; align-items: center; gap: 6px; }
    .mbar-row[hidden] { display: none; }
    .mbar-row + .mbar-row { margin-top: 6px; }
    .mbar-group { display: flex; gap: 6px; }
    .mbar button { font: inherit; font-weight: 700; border: 1px solid var(--line); border-radius: 0; background: var(--surface); color: var(--text); cursor: pointer; }
    .mbar-group button { min-height: 36px; padding: 0 14px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; }
    #mbar-cats button { flex: 1 1 0; padding: 0 4px; text-transform: none; letter-spacing: 0; }
    #mbar-years button { padding: 0 12px; text-transform: none; letter-spacing: 0; background: var(--bg); }
    #mbar button[aria-selected="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
    #mbar-toc { flex: none; width: 40px; height: 36px; padding: 0; border-color: var(--text); display: grid; place-items: center; }
    #mbar-toc span { width: 18px; height: 2px; background: var(--text); box-shadow: 0 -6px 0 var(--text), 0 6px 0 var(--text); }

    @media (max-width: 760px) {
      .mobile body { display: block; min-height: 0; }
      .mobile main { display: block; }
      .mobile .frame-panel { min-height: 0; margin: -2px -8px 0; }
      .mobile .report-frame { flex: none; height: 80vh; }
      .mobile .eyebrow { display: none; }
      .mobile h1 { flex: 1 1 0; min-width: 0; }
      .mobile .league-tabs { flex: 0 0 100%; justify-content: flex-end; }
      .mobile .tab, .mobile .sub-tab, .mobile .league-tabs button { min-height: 40px; }
      .mobile header { position: static; }
      .mobile .mbar { display: block; position: fixed; top: 0; left: 0; right: 0; z-index: 57; padding: 6px 8px;
        background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
        transform: translateY(-110%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; }
      .mobile .mbar.show { transform: none; visibility: visible; transition: transform .2s ease; }
    }
/* 報告頁共用樣式（目錄、提示框），由各產生器附加在各報告自己的樣式後面 */
.rc-btn { position: fixed; left: 12px; top: var(--rc-top, 14px); z-index: 60; width: 40px; height: 40px; padding: 0;
  display: grid; place-items: center; background: var(--surface); color: var(--text); border: 1px solid var(--text); cursor: pointer; }
.rc-btn.inline { position: static; flex: none; align-self: center; margin-right: 4px; }
.rc-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.rc-icon { position: relative; width: 18px; height: 2px; background: currentColor; transition: transform .3s ease; }
.rc-icon::before, .rc-icon::after { content: ""; position: absolute; left: 0; width: 18px; height: 2px; background: currentColor; }
.rc-icon::before { top: -6px; }
.rc-icon::after { top: 6px; }
.rc-btn:hover .rc-icon, .rc-btn:focus-visible .rc-icon, .rc-btn[aria-expanded="true"] .rc-icon { transform: rotate(90deg); }
.rc-btn::after { content: attr(data-tip); position: absolute; left: 48px; top: 50%; transform: translateY(-50%); padding: 3px 9px; white-space: nowrap;
  background: var(--text); color: var(--bg); font-size: .78rem; opacity: 0; pointer-events: none; transition: opacity .15s ease; z-index: 61; }
.rc-btn:hover::after, .rc-btn:focus-visible::after { opacity: 1; }
.rc-btn[aria-expanded="true"]::after { opacity: 0; }
.rc-drawer { position: fixed; left: 0; top: 0; bottom: 0; z-index: 59; width: min(280px, 82vw); padding: 64px 0 24px; overflow-y: auto;
  background: var(--surface); color: var(--text); border-right: 1px solid var(--text); transform: translateX(-102%); visibility: hidden;
  transition: transform .28s cubic-bezier(.2,.7,.2,1), visibility 0s linear .28s; }
.rc-drawer.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.2,.7,.2,1); }
.rc-drawer h2 { margin: 0 0 8px; padding: 0 20px; font-size: .78rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.rc-drawer a { display: block; padding: 10px 20px; color: var(--text); text-decoration: none; border-left: 4px solid transparent; font-size: .95rem; }
.rc-drawer a:hover { background: color-mix(in srgb, var(--text) 8%, transparent); }
.rc-drawer a[aria-current="true"] { border-left-color: var(--accent); font-weight: 700; background: color-mix(in srgb, var(--text) 6%, transparent); }
.rc-scrim { position: fixed; inset: 0; z-index: 58; background: rgba(0,0,0,.35); opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s linear .2s; }
.rc-scrim.open { opacity: 1; visibility: visible; transition: opacity .2s ease; }
/* 寬螢幕：目錄展開時把頁面往右推，不蓋住內容；窄螢幕：蓋在上面，用背景遮罩關閉 */
@media (min-width: 761px) {
  .rc-drawer { width: 280px; }
  .rc-scrim { display: none; }
  html.rc-toc-open body { padding-left: 280px; }
}
@media (prefers-reduced-motion: no-preference) {
  body { transition: padding-left .28s cubic-bezier(.2,.7,.2,1); }
}
.rc-tip { position: fixed; z-index: 80; max-width: 320px; padding: 8px 11px; background: var(--text); color: var(--bg); font-size: .82rem; line-height: 1.5;
  pointer-events: none; opacity: 0; transition: opacity .12s ease; white-space: normal; text-align: left; font-weight: 400; }
.rc-tip.show { opacity: 1; }
.rc-goto { font-weight: 650; }
th:focus-visible, .stat small:focus-visible, .pill:focus-visible, .branch-head h3:focus-visible, .formula > strong:focus-visible, #segment-table td:first-child:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.rc-drawer a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  </style>

      fired = true;
      entry.target.classList.add('in');
      // 長條縮成 0 寬時面積為 0，跨來源 iframe 內的觀察器可能不回報；改觀察它的容器，再展開裡面的長條
      if (entry.target._bars) entry.target._bars.forEach(function (b) { b.classList.add('in'); });
      io.unobserve(entry.target);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0 });
  doc.querySelectorAll('main section').forEach(function (el) { el.classList.add('reveal'); io.observe(el); });
  doc.querySelectorAll('.bar').forEach(function (el) {
    el.classList.add('barr');
    var host = el.parentElement;
    (host._bars = host._bars || []).push(el);
    io.observe(host);
  });
  doc.documentElement.classList.add('js-reveal');
  // 保險：觀察器一直沒有回報（例如被瀏覽器節流）時，直接顯示全部內容，避免頁面空白。
  setTimeout(function () { if (!fired) doc.documentElement.classList.remove('js-reveal'); }, 1500);
})();

const allLeagues = JSON.parse(document.getElementById("categories-data").textContent);
let categories = [];

const primaryTabs = document.getElementById("primary-tabs");
const secondaryTabs = document.getElementById("secondary-tabs");
const frame = document.getElementById("report-frame");
const frameLabel = document.getElementById("frame-current-label");
const frameOpenNew = document.getElementById("frame-open-new");

let activeCategoryId = null;
let activeYear = null;
let lastAnchor = null;

function categoryById(id) {
  return categories.find((c) => c.id === id);
}

function renderPrimaryTabs() {
  primaryTabs.querySelectorAll(".tab").forEach((btn) => {
    btn.setAttribute("aria-selected", btn.dataset.cat === activeCategoryId ? "true" : "false");
  });
}

function renderSecondaryTabs() {
  const cat = categoryById(activeCategoryId);
  const hasYearTabs = cat.variants.length > 1;
  if (!hasYearTabs) {
    secondaryTabs.hidden = true;
    secondaryTabs.innerHTML = "";
    return;
  }
  secondaryTabs.hidden = false;
  secondaryTabs.innerHTML = cat.variants
    .map(
      (v, i) =>
        `<button type="button" class="sub-tab" data-idx="${i}" aria-selected="${i === cat.defaultIndex ? "true" : "false"}">${v.year}</button>`
    )
    .join("");
}

// 入口頁與報告頁（iframe）用 postMessage 溝通，這樣本機以 file:// 開啟（跨來源）時也能運作：
// report-anchor 回報目前停在哪個區塊（切換報告時捲回同一區塊）、report-ready 帶目錄項目、
// report-height 讓手機版把 iframe 撐成內容高度（只剩一層捲動）、report-goto-category 切換分頁。
let tocApi = null;
const mobileQuery = window.matchMedia("(max-width: 760px)");
let mobile = false;

function applyMobile() {
  mobile = mobileQuery.matches;
  document.documentElement.classList.toggle("mobile", mobile);
  if (!mobile) frame.style.height = "";
}
mobileQuery.addEventListener("change", applyMobile);
applyMobile();

function mountParentToc(items) {
  if (!window.ReportCommon || !items || !items.length) return;
  tocApi = window.ReportCommon.mountToc(items, {
    inline: document.querySelector(".title-row"),
    onGo: (id) => frame.contentWindow.postMessage({ type: "report-goto", id }, "*"),
  });
}

window.addEventListener("message", (event) => {
  if (event.source !== frame.contentWindow || !event.data) return;
  const d = event.data;
  if (d.type === "report-anchor") {
    lastAnchor = d.anchor;
    if (tocApi) tocApi.setActive(d.anchor.section && d.anchor.section.id);
  } else if (d.type === "report-height") {
    if (mobile) frame.style.height = `${d.height}px`;
  } else if (d.type === "report-scroll-to") {
    if (mobile) {
      // 往上跳時頂欄會浮現，多讓出它的高度，標題才不會被蓋住
      const target = frame.getBoundingClientRect().top + window.scrollY + d.y;
      window.scrollTo({ top: target - (mbar && target < window.scrollY ? mbar.offsetHeight : 0), behavior: "smooth" });
    }
  } else if (d.type === "report-goto-category") {
    if (categoryById(d.id)) {
      lastAnchor = null;
      activateCategory(d.id);
    }
  } else if (d.type === "report-ready") {
    frame.style.opacity = "1";
    if (mobile && d.height) frame.style.height = `${d.height}px`;
    mountParentToc(d.items);
    if (lastAnchor) frame.contentWindow.postMessage({ type: "report-restore", anchor: lastAnchor }, "*");
  }
});

// 手機版整頁捲動：定期請報告頁換算「目前停在哪個區塊」。
let queryTimer = null;
window.addEventListener("scroll", () => {
  if (!mobile || queryTimer) return;
  queryTimer = setTimeout(() => {
    queryTimer = null;
    const y = Math.max(0, -frame.getBoundingClientRect().top);
    frame.contentWindow.postMessage({ type: "report-query", y }, "*");
  }, 120);
});

frame.addEventListener("load", () => { frame.style.opacity = "1"; });

// 手機版浮動頂欄：往上捲時浮現，放目錄、聯盟與年份，不必捲回頁首就能切換（只有入口頁有這個元素）
const mbar = document.getElementById("mbar");
const mbarLeagues = document.getElementById("mbar-leagues");
const mbarYears = document.getElementById("mbar-years");
const mbarCats = document.getElementById("mbar-cats");
const leagueNav = document.getElementById("league-tabs");
let keepBarUntil = 0;

function barButtons(buttons, attr) {
  return buttons
    .map((b) => `<button type="button" data-${attr}="${b.dataset[attr]}" aria-selected="${b.getAttribute("aria-selected")}">${b.textContent}</button>`)
    .join("");
}

function syncBar() {
  if (!mbar) return;
  mbarLeagues.innerHTML = leagueNav ? barButtons([...leagueNav.querySelectorAll("button")], "league") : "";
  const years = [...secondaryTabs.querySelectorAll(".sub-tab")];
  mbarCats.innerHTML = [...primaryTabs.querySelectorAll(".tab")]
    .map((b) => `<button type="button" data-cat="${b.dataset.cat}" aria-selected="${b.getAttribute("aria-selected")}">${categoryById(b.dataset.cat).short}</button>`)
    .join("");
  mbarYears.hidden = years.length === 0;
  mbarYears.innerHTML = barButtons(years, "idx");
}

if (mbar) {
  mbar.addEventListener("click", (event) => {
    const btn = event.target.closest("button");
    if (!btn) return;
    keepBarUntil = Date.now() + 2500;
    if (btn.id === "mbar-toc") {
      const tocBtn = document.querySelector(".rc-btn");
      if (tocBtn) tocBtn.click();
    } else if (btn.dataset.cat) {
      primaryTabs.querySelector(`.tab[data-cat="${btn.dataset.cat}"]`).click();
    } else if (btn.dataset.league) {
      leagueNav.querySelector(`button[data-league="${btn.dataset.league}"]`).click();
    } else if (btn.dataset.idx) {
      secondaryTabs.querySelector(`.sub-tab[data-idx="${btn.dataset.idx}"]`).click();
    }
  });
  let lastY = window.scrollY;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    const dy = y - lastY;
    lastY = y;
    // 剛點過頂欄的幾秒內（換報告時頁面高度會跳動）維持原狀，不要被連帶的捲動事件收掉
    if (!mobile || Date.now() < keepBarUntil) return;
    if (y <= document.querySelector("header").offsetHeight) mbar.classList.remove("show");
    else if (dy < -4) mbar.classList.add("show");
    else if (dy > 4) mbar.classList.remove("show");
  }, { passive: true });
}

function selectVariant(cat, index) {
  const variant = cat.variants[index] || cat.variants[0];
  activeYear = variant.year;
  frame.style.opacity = "0.15";
  const label = variant.year ? `${cat.label}・${variant.year}` : cat.label;
  frameLabel.textContent = `${label}｜${cat.description}`;
  frameLabel.title = cat.description;
  frameOpenNew.href = variant.file;
  // 手機版 iframe 高度跟著內容走；換報告時先放掉舊高度，否則新報告比舊的短時，底下會留一大片空白
  if (mobile) frame.style.height = "";
  frame.src = variant.file;
  secondaryTabs.querySelectorAll(".sub-tab").forEach((btn) => {
    btn.setAttribute("aria-selected", Number(btn.dataset.idx) === index ? "true" : "false");
  });
  syncBar();
}

function activateCategory(id) {
  if (id !== activeCategoryId) lastAnchor = null;
  activeCategoryId = id;
  const cat = categoryById(id);
  renderPrimaryTabs();
  renderSecondaryTabs();
  // 同分類換聯盟或換分類時，盡量沿用目前年份。
  const sameYear = cat.variants.findIndex((v) => v.year && v.year === activeYear);
  const index = sameYear >= 0 ? sameYear : cat.defaultIndex;
  if (index !== cat.defaultIndex) {
    secondaryTabs.querySelectorAll(".sub-tab").forEach((btn) => {
      btn.setAttribute("aria-selected", Number(btn.dataset.idx) === index ? "true" : "false");
    });
  }
  selectVariant(cat, index);
}

secondaryTabs.addEventListener("click", (event) => {
  const btn = event.target.closest(".sub-tab");
  if (!btn) return;
  selectVariant(categoryById(activeCategoryId), Number(btn.dataset.idx));
});


const leagueTabs = document.getElementById("league-tabs");

function renderPrimaryButtons() {
  primaryTabs.innerHTML = categories
    .map((c) => `<button type="button" class="tab" data-cat="${c.id}" aria-selected="false">${c.label}</button>`)
    .join("");
  primaryTabs.querySelectorAll(".tab").forEach((btn) => {
    btn.addEventListener("click", () => activateCategory(btn.dataset.cat));
  });
}

function activateLeague(league) {
  if (!allLeagues[league]) league = Object.keys(allLeagues)[0];
  categories = allLeagues[league];
  leagueTabs.querySelectorAll("button").forEach((btn) => {
    btn.setAttribute("aria-selected", btn.dataset.league === league ? "true" : "false");
  });
  document.getElementById("league-eyebrow").textContent = league.toUpperCase() + " · 2 OUT, RUNNER ON FIRST";
  try { history.replaceState(null, "", "#" + league); } catch (e) {}
  renderPrimaryButtons();
  // 換聯盟時保持在同一個分類，該分類不存在才回到第一個。
  const keep = categories.find((c) => c.id === activeCategoryId);
  activateCategory(keep ? keep.id : categories[0].id);
}

leagueTabs.addEventListener("click", (event) => {
  const btn = event.target.closest("button");
  if (btn) activateLeague(btn.dataset.league);
});

activateLeague(location.hash.replace("#", ""));

  </script>
</body>
